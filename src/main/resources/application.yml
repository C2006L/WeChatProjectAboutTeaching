server:
  port: 8080

spring:
  application:
    name: course-pack-server

  # ── MySQL 数据源配置 ──
  # 注意：请将密码改为你自己的 MySQL 密码
  datasource:
    url: jdbc:mysql://localhost:3306/course_pack?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 你的MySQL密码
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  # ── Redis 配置（需安装 Redis） ──
  redis:
    host: localhost
    port: 6379
    password:
    database: 0
    timeout: 3000ms

  # ── Jackson JSON 配置 ──
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  # ── 文件上传限制 ──
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# ── MyBatis-Plus 配置 ──
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ── Knife4j API 文档配置 ──
knife4j:
  enable: true
  setting:
    language: zh_cn

# ── 日志级别 ──
logging:
  level:
    com.coursepack: debug
    com.baomidou.mybatisplus: debug
