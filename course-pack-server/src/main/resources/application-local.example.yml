# 本地配置模板：复制为 application-local.yml（同目录）并填入真实值。
# 该文件已被 .gitignore 忽略，不会进入版本库。
# 生产环境也可不用本文件，改用环境变量：MYSQL_USERNAME / MYSQL_PASSWORD / JWT_SECRET。
spring:
  datasource:
    username: root
    password: 你的MySQL密码

# HS256 要求密钥长度 >= 32 字节
jwt:
  secret: 更换为至少32字节的随机密钥

# ── 微信小程序（批次I 启用 wx-login 时填写，暂不需要可留空） ──
wechat:
  appid: 你的小程序AppID
  secret: 你的小程序AppSecret
