server:
  port: 8080

spring:
  application:
    name: course-pack-server

  # ── 本地配置：默认启用 local profile ──
  # 真实凭据（数据库密码、JWT 密钥等）放在 application-local.yml（已 gitignore）
  # 部署/其他机器：复制 application-local.example.yml 为 application-local.yml 并填入自己的值，
  # 或改用环境变量 SPRING_PROFILES_ACTIVE=prod 覆盖 profile。
  profiles:
    active: local

  # ── MySQL 数据源配置 ──
  # 密码与用户名从 application-local.yml（本地）或环境变量注入，不在版本库中保存
  datasource:
    url: jdbc:mysql://localhost:3306/course_pack?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  # ── Redis 配置（需安装 Redis） ──
  redis:
    host: localhost
    port: 6379
    password:
    database: 0
    timeout: 3000ms

  # ── Jackson JSON 配置 ──
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  # ── 文件上传限制 ──
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# ── MyBatis-Plus 配置 ──
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ── Knife4j API 文档配置 ──
knife4j:
  enable: true
  setting:
    language: zh_cn

# ── 日志级别 ──
logging:
  level:
    com.coursepack: debug
    com.baomidou.mybatisplus: debug

# ── JWT（批次E 统一认证；HS256 要求 >= 32 字节） ──
# 密钥从 application-local.yml（本地）或环境变量 JWT_SECRET 注入；
# 不写回退明文，缺失时启动即在 JwtUtil 处报错，避免弱密钥上生产。
jwt:
  secret: ${JWT_SECRET:}
